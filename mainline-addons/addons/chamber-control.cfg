# Bounded wrapper for a separately commissioned [heater_generic chamber].

[gcode_macro PLUS4_SET_CHAMBER]
description: Set the commissioned chamber heater within a conservative bound
variable_max_target: 65.0
gcode:
    {% if "heater_generic chamber" not in printer %}
        { action_raise_error("PLUS4_SET_CHAMBER requires [heater_generic chamber]") }
    {% endif %}
    {% set target = params.TARGET|default(0)|float %}
    {% set maximum = printer["gcode_macro PLUS4_SET_CHAMBER"].max_target|float %}
    {% if target < 0 or target > maximum %}
        { action_raise_error("Chamber TARGET must be between 0 and %.1f C" % maximum) }
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={target}

[gcode_macro PLUS4_CHAMBER_OFF]
description: Disable the chamber heater
gcode:
    {% if "heater_generic chamber" in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
    {% else %}
        { action_respond_info("No [heater_generic chamber] is configured") }
    {% endif %}

