# This contract intentionally refuses motion until replaced with a tested
# Plus4 cutter implementation. Do not remove the refusal casually.

[gcode_macro _PLUS4_CUTTER_ACTUATE]
description: Replace with the reviewed physical cutter sequence
gcode:
    { action_raise_error("Plus4 cutter actuation has not been commissioned") }

[gcode_macro PLUS4_CUTTER]
description: Guarded public hook for Plus4 cutter integrations
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% if "x" not in homed or "y" not in homed or "z" not in homed %}
        { action_raise_error("Home X, Y, and Z before cutter operation") }
    {% endif %}
    _PLUS4_CUTTER_ACTUATE

