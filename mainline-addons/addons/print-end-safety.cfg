# Call from an existing END_PRINT/MMU_END flow. This does not replace it.

[gcode_macro PLUS4_PRINT_END_SAFETY]
description: Return optional Plus4 systems to a conservative idle state
gcode:
    {% if "heater_generic chamber" in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
    {% endif %}
    M107
    {% if "bed_mesh" in printer %}
        BED_MESH_CLEAR
    {% endif %}
