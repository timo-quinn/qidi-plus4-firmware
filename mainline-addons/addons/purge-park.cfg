# Set park_x and park_y only after measuring a collision-free location.

[gcode_macro PLUS4_PURGE_PARK]
description: Move to a reviewed Plus4 purge or wipe location
variable_park_x: -1.0
variable_park_y: -1.0
variable_safe_z: 10.0
variable_travel_speed: 120.0
gcode:
    {% set cfg = printer["gcode_macro PLUS4_PURGE_PARK"] %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if cfg.park_x < 0 or cfg.park_y < 0 %}
        { action_raise_error("Set PLUS4_PURGE_PARK park_x and park_y before use") }
    {% endif %}
    {% if "x" not in homed or "y" not in homed or "z" not in homed %}
        { action_raise_error("Home X, Y, and Z before purge parking") }
    {% endif %}
    {% if cfg.safe_z < 0 or cfg.safe_z > printer.toolhead.axis_maximum.z %}
        { action_raise_error("Configured safe_z is outside the Z travel range") }
    {% endif %}
    SAVE_GCODE_STATE NAME=PLUS4_PURGE_PARK_STATE
    G90
    G0 Z{[printer.toolhead.position.z, cfg.safe_z]|max} F{cfg.travel_speed * 60}
    G0 X{cfg.park_x} Y{cfg.park_y} F{cfg.travel_speed * 60}
    RESTORE_GCODE_STATE NAME=PLUS4_PURGE_PARK_STATE MOVE=0

