# Uses the adaptive mesh support included in mainline Klipper 0.13 and newer.

[gcode_macro PLUS4_ADAPTIVE_MESH]
description: Build a fresh native adaptive mesh for defined print objects
gcode:
    {% if "bed_mesh" not in printer %}
        { action_raise_error("PLUS4_ADAPTIVE_MESH requires [bed_mesh]") }
    {% endif %}
    {% if "exclude_object" not in printer %}
        { action_raise_error("PLUS4_ADAPTIVE_MESH requires [exclude_object] and slicer object labels") }
    {% endif %}
    {% set margin = params.MARGIN|default(5)|float %}
    {% set method = params.METHOD|default("automatic")|lower %}
    {% if margin < 0 or margin > 30 %}
        { action_raise_error("MARGIN must be between 0 and 30 mm") }
    {% endif %}
    {% if method not in ["automatic", "scan", "rapid_scan"] %}
        { action_raise_error("METHOD must be automatic, scan, or rapid_scan") }
    {% endif %}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE METHOD={method} ADAPTIVE=1 ADAPTIVE_MARGIN={margin}

