# Read-only status summary. This file does not declare or actuate hardware.

[gcode_macro PLUS4_STATUS]
description: Report the main Plus4 runtime state
gcode:
    {% set homed = printer.toolhead.homed_axes|default("none") %}
    { action_respond_info("Plus4 homed axes: %s" % homed) }
    { action_respond_info("Main MCU: %s" % (printer.mcu.mcu_version|default("unknown"))) }
    {% if "mcu Toolhead" in printer %}
        { action_respond_info("Toolhead MCU: %s" % (printer["mcu Toolhead"].mcu_version|default("unknown"))) }
    {% endif %}
    {% if "heater_bed" in printer %}
        { action_respond_info("Bed: %.1f / %.1f C" % (printer.heater_bed.temperature, printer.heater_bed.target)) }
    {% endif %}
    {% if "extruder" in printer %}
        { action_respond_info("Hotend: %.1f / %.1f C" % (printer.extruder.temperature, printer.extruder.target)) }
    {% endif %}
    {% if "heater_generic chamber" in printer %}
        { action_respond_info("Chamber: %.1f / %.1f C" % (printer["heater_generic chamber"].temperature, printer["heater_generic chamber"].target)) }
    {% endif %}
    {% if "bed_mesh" in printer %}
        { action_respond_info("Bed mesh profile: %s" % (printer.bed_mesh.profile_name|default("none"))) }
    {% endif %}
