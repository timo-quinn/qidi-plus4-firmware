# QIDI Box control panel for unmodified Mainsail and Fluidd
#
# An open replacement for the "Control Box" panel in QIDI's Fluidd fork, built
# only from Klipper macro prompts so that no front-end has to be forked or
# patched. Requires Klipper's [respond] module, Mainsail 2.9.0+ or a Fluidd
# release with prompt-dialog support, and a working QIDI Box backend.
#
# Open PLUS4_BOX from the macro list to get the slot grid.
#
# This file does not declare any pin, stepper, heater, fan or sensor. It reads
# published printer objects and calls the backend's own commands.

# ----------------------------------------------------------------------------
# Backend adapter
#
# Every backend-specific name lives in this section and in the _PLUS4_BOX_READ
# block below. Retargeting the panel at a different Box backend (an open
# reimplementation, or Happy Hare's `mmu` object) means editing those two
# places only; the dialog macros never reference a vendor object directly.
#
# Backend: QIDI compiled Klipper modules (box_extras, box_stepper, aht20_f)
#   commands       E_BOX slot=N | E_LOAD slot=N | E_UNLOAD slot=N
#                  RFID_READ SLOT=slotN
#   presence       [box_stepper slotN].runout_button == 0
#   path occupied  [box_extras].b_endstop_state == 0
#   busy           [box_extras].box_button_state
#   humidity       [aht20_f heater_boxN].humidity
#   slot metadata  save_variables: box_count, vendor_slotN, filament_slotN,
#                  color_slotN, last_load_slot ("slotN"), enable_box
# ----------------------------------------------------------------------------
[gcode_macro _PLUS4_BOX_CONFIG]
description: Configuration and backend binding for the Box control panel
variable_slots_per_box: 4
variable_external_slot: 16
# QIDI stores vendor/material/colour as integer indices into
# officiall_filas_list.cfg. Klipper macros cannot read that file, so supply the
# handful of names you actually use to get readable labels, for example:
#   variable_material_names: {1: 'PLA', 7: 'PLA Silk', 12: 'PETG'}
variable_material_names: {}
# Refuse slot actions while a print is running unless FORCE=1 is passed.
variable_block_while_printing: True
gcode:
    {action_respond_info("PLUS4_BOX_CONFIG holds panel settings; run PLUS4_BOX.")}


[gcode_macro _PLUS4_BOX_ACTION]
description: Backend command dispatch for the Box control panel
gcode:
    {% set slot = params.SLOT|int %}
    {% set verb = params.VERB|string %}
    {% if verb == 'load' %}
        E_LOAD slot={slot}
    {% elif verb == 'unload' %}
        E_UNLOAD slot={slot}
    {% elif verb == 'eject' %}
        E_BOX slot={slot}
    {% elif verb == 'rfid' %}
        RFID_READ SLOT=slot{slot}
    {% else %}
        {action_raise_error("Unknown Box action: %s" % verb)}
    {% endif %}


# ----------------------------------------------------------------------------
# Panel
# ----------------------------------------------------------------------------
[gcode_macro PLUS4_BOX]
description: Open the QIDI Box control panel
gcode:
    {% set cfg = printer['gcode_macro _PLUS4_BOX_CONFIG'] %}
    {% set per_box = cfg.slots_per_box|int %}
    {% set names = cfg.material_names %}
    {% set vars = printer['save_variables'].variables if 'save_variables' in printer else {} %}
    {% set boxes = vars.box_count|default(0)|int %}
    {% set extras = printer['box_extras'] if 'box_extras' in printer else {} %}
    {% set path_busy = (extras.b_endstop_state|default(1)|int == 0) %}
    {% set loaded = (vars.last_load_slot|default('')|string|replace('slot', '') or '-1')|int %}

    RESPOND TYPE=command MSG=action:prompt_end
    RESPOND TYPE=command MSG="action:prompt_begin Control Box"

    {% if boxes < 1 %}
        RESPOND TYPE=command MSG="action:prompt_text No QIDI Box detected. save_variables reports box_count=0."
        RESPOND TYPE=command MSG="action:prompt_text Check that the Box backend modules are loaded and the Box is powered."
    {% else %}
        {% if vars.enable_box is defined and vars.enable_box|int != 1 %}
            RESPOND TYPE=command MSG="action:prompt_text Box use is currently disabled (enable_box=0)."
        {% endif %}
        {% for box in range(boxes) %}
            {% set humidity_obj = 'aht20_f heater_box' ~ (box + 1) %}
            {% set humidity = printer[humidity_obj].humidity|default(0)|round(0)|int if humidity_obj in printer else -1 %}
            RESPOND TYPE=command MSG="action:prompt_text Box {box + 1}{' - humidity ' ~ humidity ~ '%' if humidity >= 0 else ''}"
            RESPOND TYPE=command MSG=action:prompt_button_group_start
            {% for index in range(box * per_box, (box + 1) * per_box) %}
                {% set label = (box + 1)|string ~ 'ABCDEFGH'[index % per_box] %}
                {% set stepper = 'box_stepper slot' ~ index %}
                {% set present = (printer[stepper].runout_button|default(1)|int == 0) if stepper in printer else False %}
                {% set material = names.get(vars['filament_slot' ~ index]|default(0)|int, '') %}
                {% if not present %}
                    {% set text = label ~ ' - empty' %}
                    {% set colour = 'secondary' %}
                {% elif index == loaded and path_busy %}
                    {% set text = label ~ ' - loaded' ~ (' ' ~ material if material else '') %}
                    {% set colour = 'primary' %}
                {% else %}
                    {% set text = label ~ (' ' ~ material if material else ' - ready') %}
                    {% set colour = 'info' %}
                {% endif %}
                RESPOND TYPE=command MSG="action:prompt_button {text}|_PLUS4_BOX_SLOT SLOT={index}|{colour}"
            {% endfor %}
            RESPOND TYPE=command MSG=action:prompt_button_group_end
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button External spool (Rack)|_PLUS4_BOX_SLOT SLOT={cfg.external_slot|int}|secondary"
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_footer_button Close|_PLUS4_BOX_CLOSE|error"
    RESPOND TYPE=command MSG=action:prompt_show


[gcode_macro _PLUS4_BOX_SLOT]
description: Show the actions available for one Box slot
gcode:
    {% set slot = params.SLOT|int %}
    {% set cfg = printer['gcode_macro _PLUS4_BOX_CONFIG'] %}
    {% set per_box = cfg.slots_per_box|int %}
    {% set external = (slot >= cfg.external_slot|int) %}
    {% set names = cfg.material_names %}
    {% set vars = printer['save_variables'].variables if 'save_variables' in printer else {} %}
    {% set extras = printer['box_extras'] if 'box_extras' in printer else {} %}
    {% set stepper = 'box_stepper slot' ~ slot %}

    {% set present = True if external else ((printer[stepper].runout_button|default(1)|int == 0) if stepper in printer else False) %}
    {% set path_busy = (extras.b_endstop_state|default(1)|int == 0) %}
    {% set loaded_slot = (vars.last_load_slot|default('')|string|replace('slot', '') or '-1')|int %}
    {% set is_loaded = present and path_busy and (slot == loaded_slot) %}
    {% set busy = extras.box_button_state|default(0)|int != 0 %}
    {% set label = 'External spool (Rack)' if external else ((slot // per_box) + 1)|string ~ 'ABCDEFGH'[slot % per_box] %}
    {% set material = names.get(vars['filament_slot' ~ slot]|default(0)|int, '') %}
    {% set rfid = printer[stepper].rfid_state|default('') if stepper in printer else '' %}

    RESPOND TYPE=command MSG=action:prompt_end
    RESPOND TYPE=command MSG="action:prompt_begin Slot {label}"
    {% if material %}
        RESPOND TYPE=command MSG="action:prompt_text Material: {material}"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text {'Loaded to the toolhead' if is_loaded else ('Filament present' if present else 'No filament detected')}"
    {% if rfid %}
        RESPOND TYPE=command MSG="action:prompt_text RFID: {rfid}"
    {% endif %}
    {% if busy %}
        RESPOND TYPE=command MSG="action:prompt_text The Box is currently busy; actions are hidden."
    {% else %}
        RESPOND TYPE=command MSG=action:prompt_button_group_start
        {% if present and not is_loaded %}
            RESPOND TYPE=command MSG="action:prompt_button Load|_PLUS4_BOX_RUN VERB=load SLOT={slot}|primary"
        {% endif %}
        {% if is_loaded or external %}
            RESPOND TYPE=command MSG="action:prompt_button Unload|_PLUS4_BOX_RUN VERB=unload SLOT={slot}|warning"
        {% endif %}
        {% if present and not external %}
            RESPOND TYPE=command MSG="action:prompt_button Eject|_PLUS4_BOX_RUN VERB=eject SLOT={slot}|warning"
        {% endif %}
        RESPOND TYPE=command MSG=action:prompt_button_group_end
        {% if not external %}
            RESPOND TYPE=command MSG="action:prompt_button Read RFID tag|_PLUS4_BOX_RUN VERB=rfid SLOT={slot}|info"
        {% endif %}
        {% if not present and not external %}
            RESPOND TYPE=command MSG="action:prompt_text Insert filament into this lane to enable loading."
        {% endif %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PLUS4_BOX|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|_PLUS4_BOX_CLOSE|error"
    RESPOND TYPE=command MSG=action:prompt_show


[gcode_macro _PLUS4_BOX_RUN]
description: Validate and dispatch one Box slot action
gcode:
    {% set slot = params.SLOT|int %}
    {% set verb = params.VERB|string %}
    {% set cfg = printer['gcode_macro _PLUS4_BOX_CONFIG'] %}
    {% set forced = params.FORCE|default(0)|int == 1 %}
    {% set printing = (printer['print_stats'].state|default('') if 'print_stats' in printer else '') == 'printing' %}

    RESPOND TYPE=command MSG=action:prompt_end
    {% if slot < 0 or slot > cfg.external_slot|int %}
        {action_raise_error("Box slot %d is out of range" % slot)}
    {% endif %}
    {% if printing and cfg.block_while_printing and not forced %}
        {action_raise_error("Refusing to %s slot %d during a print. Pass FORCE=1 only if the sequence is known to be safe." % (verb, slot))}
    {% endif %}
    {action_respond_info("Box slot %d: %s" % (slot, verb))}
    _PLUS4_BOX_ACTION VERB={verb} SLOT={slot}


[gcode_macro _PLUS4_BOX_CLOSE]
description: Close the Box control panel dialog
gcode:
    RESPOND TYPE=command MSG=action:prompt_end


[gcode_macro PLUS4_BOX_STATUS]
description: Print QIDI Box state to the console without opening a dialog
gcode:
    {% set cfg = printer['gcode_macro _PLUS4_BOX_CONFIG'] %}
    {% set per_box = cfg.slots_per_box|int %}
    {% set vars = printer['save_variables'].variables if 'save_variables' in printer else {} %}
    {% set boxes = vars.box_count|default(0)|int %}
    {% set extras = printer['box_extras'] if 'box_extras' in printer else {} %}
    {% set loaded = (vars.last_load_slot|default('')|string|replace('slot', '') or '-1')|int %}

    {% if boxes < 1 %}
        {action_respond_info("No QIDI Box detected (box_count=0).")}
    {% else %}
        {action_respond_info("Boxes: %d  gate sensor: %s  extruder sensor: %s  busy: %s"
            % (boxes,
               'filament' if extras.b_endstop_state|default(1)|int == 0 else 'clear',
               'filament' if extras.e_endstop_state|default(1)|int == 0 else 'clear',
               'yes' if extras.box_button_state|default(0)|int != 0 else 'no')) }
        {% for index in range(boxes * per_box) %}
            {% set stepper = 'box_stepper slot' ~ index %}
            {% set label = ((index // per_box) + 1)|string ~ 'ABCDEFGH'[index % per_box] %}
            {% set present = (printer[stepper].runout_button|default(1)|int == 0) if stepper in printer else False %}
            {action_respond_info("  %s  %s%s  material_index=%s  colour_index=%s"
                % (label,
                   'present' if present else 'empty',
                   ' (loaded)' if index == loaded else '',
                   vars['filament_slot' ~ index]|default('-'),
                   vars['color_slot' ~ index]|default('-'))) }
        {% endfor %}
    {% endif %}
