# First-start Plus4/Beacon configuration. Confirm hardware before installation.
# Only the hardware and Beacon homing layer is enabled. Production, Box,
# service-area moves and optional Shake&Tune macros remain disabled.
[include hardware.cfg]
[include beacon.cfg]

[printer]
max_velocity: 100
max_accel: 1000

[stepper_x]
position_max: 305

[stepper_y]
position_max: 305

# Calibrate each heater on this printer before enabling PID or printing.
[extruder]
control: watermark
max_delta: 2
pressure_advance: 0

[heater_bed]
control: watermark
max_delta: 2

[heater_generic chamber]
control: watermark
max_delta: 2

[input_shaper]

[pause_resume]
[print_stats]
[respond]

# Hold the dual-Z motors; production implements its own guarded idle policy.
[idle_timeout]
timeout: 1800
gcode:
    TURN_OFF_HEATERS
