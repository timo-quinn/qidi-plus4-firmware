# Inert QIDI Plus4 mainline migration smoke test.
#
# This configuration defines no GPIO pins, steppers, heaters, fans, probes, or
# endstops. It exists only to prove that the host can identify and configure
# both freshly migrated MCUs over their built-in UARTs.

[mcu]
serial: /dev/ttyS0
baud: 500000
restart_method: command

[mcu toolhead]
serial: /dev/ttyS2
baud: 500000
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1
