# Mainline-native operating layer for the commissioned Plus4 hardware profile.
# Movement outside the build area (cutter, chute and nozzle brush) is
# intentionally kept out of this file until those mechanisms are tested.

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 50

# Preserve the standard [fan] behavior for P0 and add the QIDI/Orca fan indexes.
[gcode_macro M106]
rename_existing: M99106
description: Set part (P0), auxiliary (P2), or chamber circulation (P3) fan
gcode:
    {% set fan = params.P|default(0)|int %}
    {% set raw = params.S|default(255)|float %}
    {% set speed = [1.0, [0.0, raw / 255.0]|max]|min %}
    {% if fan == 0 %}
        M99106 S{raw}
    {% elif fan == 2 %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={speed}
    {% elif fan == 3 %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={speed}
    {% else %}
        { action_respond_info("Ignoring unsupported fan index P%d" % fan) }
    {% endif %}

[gcode_macro M107]
rename_existing: M99107
description: Stop part (P0), auxiliary (P2), or chamber circulation (P3) fan
gcode:
    {% set fan = params.P|default(0)|int %}
    {% if fan == 0 %}
        M99107
    {% elif fan == 2 %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
    {% elif fan == 3 %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    {% else %}
        { action_respond_info("Ignoring unsupported fan index P%d" % fan) }
    {% endif %}

[gcode_macro M141]
description: Set chamber temperature without waiting (maximum 65 C)
gcode:
    {% set target = [65.0, [0.0, params.S|default(0)|float]|max]|min %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={target}

[gcode_macro M191]
description: Set chamber temperature and wait while heating
gcode:
    {% set target = [65.0, [0.0, params.S|default(0)|float]|max]|min %}
    M141 S{target}
    {% if target > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={target - 1.0}
    {% endif %}

[gcode_macro BEEP]
description: Pulse the mainboard beeper
gcode:
    {% set count = [10, [1, params.I|default(1)|int]|max]|min %}
    {% set duration = [2000, [20, params.DUR|default(100)|int]|max]|min %}
    {% for unused in range(count) %}
        SET_PIN PIN=beeper VALUE=1
        G4 P{duration}
        SET_PIN PIN=beeper VALUE=0
        G4 P{duration}
    {% endfor %}

# The Plus4 bed can drift if both Z motors are released. Match the proven
# community behavior: disable requested motors, then leave both Z motors held.
[gcode_macro M84]
rename_existing: M9984
description: Disable motors while retaining both Z motors
gcode:
    M9984 {% for name in params %}{name}{params[name]} {% endfor %}
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1

[gcode_macro _PLUS4_SAFE_PARK]
description: Lift and park within the commissioned build envelope
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% if "z" in homed %}
        {% set lift = [10.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
        {% if lift > 0 %}
            G91
            G0 Z{lift} F600
            G90
        {% endif %}
    {% endif %}
    {% if "x" in homed and "y" in homed %}
        G90
        G0 X10 Y300 F9000
    {% endif %}

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Pause, retract, lift, and park safely
gcode:
    {% if not printer.pause_resume.is_paused %}
        SAVE_GCODE_STATE NAME=PLUS4_PAUSE_STATE
        PAUSE_BASE
        {% if printer.extruder.can_extrude %}
            M83
            G1 E-1.0 F2400
        {% endif %}
        _PLUS4_SAFE_PARK
    {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Restore the state saved by PAUSE and resume the print
gcode:
    {% if printer.pause_resume.is_paused %}
        {% if printer.extruder.can_extrude %}
            M83
            G1 E1.0 F1800
        {% endif %}
        RESTORE_GCODE_STATE NAME=PLUS4_PAUSE_STATE MOVE=1 MOVE_SPEED=100
        RESUME_BASE
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel the current print and return the printer to a safe state
gcode:
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-1.0 F2400
    {% endif %}
    _PLUS4_SAFE_PARK
    TURN_OFF_HEATERS
    M107 P0
    M107 P2
    M107 P3
    BED_MESH_CLEAR
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    M220 S100
    M221 S100
    CANCEL_PRINT_BASE

[gcode_macro PRINT_START]
description: Heat, home, level, load or build a mesh, and begin a print
gcode:
    {% set bed = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set hotend = params.EXTRUDER_TEMP|default(params.HOTEND|default(200))|float %}
    {% set chamber = params.CHAMBER_TEMP|default(params.CHAMBER|default(0))|float %}
    {% set mesh = params.MESH|default("default")|lower %}
    CLEAR_PAUSE
    BED_MESH_CLEAR
    G90
    M140 S{bed}
    M104 S{[hotend, 150.0]|min}
    M141 S{chamber}
    G28
    M190 S{bed}
    Z_TILT_ADJUST
    G28 Z
    {% if mesh == "adaptive" %}
        BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1 RUNS=2
    {% elif mesh == "default" %}
        BED_MESH_PROFILE LOAD=default
    {% elif mesh != "none" %}
        { action_raise_error("MESH must be default, adaptive, or none") }
    {% endif %}
    M109 S{hotend}
    G92 E0

[gcode_macro PRINT_END]
description: Finish a print and leave the commissioned hardware safe
gcode:
    M400
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-1.0 F2400
    {% endif %}
    _PLUS4_SAFE_PARK
    TURN_OFF_HEATERS
    M107 P0
    M107 P2
    M107 P3
    BED_MESH_CLEAR
    M220 S100
    M221 S100
    M84

[gcode_macro END_PRINT]
description: Compatibility alias for PRINT_END
gcode:
    PRINT_END

[gcode_macro PLUS4_STATUS]
description: Report primary Plus4 state without actuating hardware
gcode:
    { action_respond_info("Homed axes: %s" % (printer.toolhead.homed_axes|default("none"))) }
    { action_respond_info("Hotend: %.1f / %.1f C" % (printer.extruder.temperature, printer.extruder.target)) }
    { action_respond_info("Bed: %.1f / %.1f C" % (printer.heater_bed.temperature, printer.heater_bed.target)) }
    { action_respond_info("Chamber: %.1f / %.1f C" % (printer["heater_generic chamber"].temperature, printer["heater_generic chamber"].target)) }
    { action_respond_info("Mesh: %s" % (printer.bed_mesh.profile_name|default("none"))) }
